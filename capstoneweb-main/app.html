<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Dashboard — Smart Classroom Noise Monitor</title>
  <link rel="stylesheet" href="css/main.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <h2>Noise Monitor</h2>
        <p>Traffic-light IoT system</p>
      </div>
      <ul class="nav-links" id="nav-links">
        <li><a href="#dashboard" data-route="dashboard"><span>📊</span> <span>Dashboard</span></a></li>
        <li><a href="#logs" data-route="logs"><span>📋</span> <span>Noise Logs</span></a></li>
        <li class="admin-only"><a href="#audio" data-route="audio"><span>🔊</span> <span>Audio Evidence</span></a></li>
        <li><a href="#reports" data-route="reports"><span>📈</span> <span>Reports</span></a></li>
        <li class="admin-only"><a href="#audit" data-route="audit"><span>📝</span> <span>Audit Trail</span></a></li>
      </ul>
      <div class="sidebar-footer">
        <div class="user-name" id="sidebar-user">—</div>
        <span class="role-badge" id="sidebar-role">—</span>
        <div class="detail" id="sidebar-rooms" style="margin-top:0.5rem"></div>
        <button type="button" class="btn btn-secondary btn-sm" style="margin-top:0.75rem;width:100%" id="btn-logout">Sign out</button>
      </div>
    </aside>
    <div class="main-content">
      <header class="topbar">
        <button type="button" class="menu-toggle" id="menu-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
          <span class="menu-toggle-bar"></span>
          <span class="menu-toggle-bar"></span>
          <span class="menu-toggle-bar"></span>
        </button>
        <div class="topbar-titles">
          <h1 id="page-title">Dashboard</h1>
          <div class="keyword" id="page-keyword">At-a-glance monitoring</div>
        </div>
        <div class="session-timer" id="session-timer">Session: 30:00</div>
      </header>
      <main class="page-body" id="page-content"></main>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
